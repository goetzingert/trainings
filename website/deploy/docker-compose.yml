# Startet die Websites Amtsklug und KI-klug auf dem Optiplex.
# Aufruf aus diesem Ordner: docker compose up -d
#
# Der Container lauscht nur auf 127.0.0.1:8090. Traefik routet über die
# Datei traefik-ki-websites.yml (File-Provider) dorthin, ohne Docker-Socket.
# Ist 8090 schon belegt, hier und in der Traefik-Datei denselben Port ändern.

services:
  ki-websites:
    image: nginx:1.27-alpine
    container_name: ki-websites
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ../amtsklug:/usr/share/nginx/html/amtsklug:ro
      - ../kiklug:/usr/share/nginx/html/kiklug:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
