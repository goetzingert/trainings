# nginx im Container auf dem Optiplex: liefert beide Sites aus und leitet
# die Zusatzdomains weiter. TLS endet in Traefik, hier kommt nur HTTP an.

# Unbekannte Hosts
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# --- Amtsklug (Behörden) ---
server {
    listen 80;
    server_name amtsklug.de;
    root /usr/share/nginx/html/amtsklug;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    server_name www.amtsklug.de;
    return 301 https://amtsklug.de$request_uri;
}

# --- KI-klug (Unternehmen) ---
server {
    listen 80;
    server_name kiklug.de;
    root /usr/share/nginx/html/kiklug;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    server_name www.kiklug.de ki-klug.de www.ki-klug.de;
    return 301 https://kiklug.de$request_uri;
}

# --- Weiterleitungsdomains ---
server {
    listen 80;
    server_name kiregelwerk.de www.kiregelwerk.de;
    return 301 https://kiklug.de/ki-regelwerk.html;
}

server {
    listen 80;
    server_name ki-in-der-verwaltung.de www.ki-in-der-verwaltung.de;
    return 301 https://amtsklug.de/;
}

# Gemeinsame Einstellungen für alle Server-Blöcke
gzip on;
gzip_types text/css application/javascript image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
